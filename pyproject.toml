[project]
name = "tibia-idle-otbm-extractor"
version = "0.1.0"
description = "Pipeline OTBM -> sprites/sheets/mapas para o tibia-idle"
requires-python = ">=3.11"

dependencies = [
    # Recorte e composição de sprites e sheets (bake_*.py, extract_sprites.py,
    # build_phaser_map.py, sheet_packer.py).
    "pillow>=10.0",
    # Appearances_pb2.py foi regerado por protoc 36.1 e chama
    # ValidateProtobufRuntimeVersion(PUBLIC, 7, 36, 1) no import: um runtime
    # mais antigo falha em tempo de import, não de uso. Regerar o schema
    # (extract_sprites/ticket 08) move este piso — mantenha os dois em sincronia.
    "protobuf>=7.36.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Os scripts rodam por caminho (extractor/scripts/*.py), não como pacote
# instalado. Não há nada para buildar.
package = false

[tool.pytest.ini_options]
testpaths = ["extractor/tests"]
